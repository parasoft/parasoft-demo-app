plugins {
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'war'
	id 'com.google.protobuf' version '0.9.6'
}

group = 'com.parasoft.demoapp'
version = '1.1.0'
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def buildMetadata = ''
if (project.hasProperty("jenkinsBuildNumber")) {
	buildMetadata += new Date().format('yyyyMMdd') + 'B' + jenkinsBuildNumber
} else {
	buildMetadata += new Date().format('yyyyMMddHHmmss')
}
if (project.hasProperty("gitCommitHash")) {
	buildMetadata += '.' + gitCommitHash
}

bootRun {
	if (project.hasProperty("port")) {
		args += ["--server.port=${project.port}"]
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

def grpcVersion = '1.84.2'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-activemq'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'com.graphql-java:graphql-java'
	compileOnly 'org.projectlombok:lombok'
	// gRPC's generated sources still use javax.annotation.Generated. This does not
	// include the legacy Servlet API and is required only at compilation time.
	compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.hsqldb:hsqldb'
	annotationProcessor 'org.projectlombok:lombok'
	// Spring Boot 4 separates the embedded Tomcat runtime from the full starter.
	// Marking the full starter as provided also moves Spring Framework into
	// WEB-INF/lib-provided, which an external Tomcat must not load.
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.graphql-java-kickstart:graphql-spring-boot-test:14.0.0'
	testImplementation 'com.graphql-java-kickstart:graphql-java-kickstart:14.0.0'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// To support higher version of keycloak
	implementation 'com.nimbusds:oauth2-oidc-sdk:9.4'

	// ActiveMQ Classic 6.3 uses Spring 7, Jetty 12 and Servlet 6.1.
	implementation 'org.apache.activemq:activemq-stomp:6.3.2'
	implementation 'org.apache.activemq:activemq-http:6.3.2'
	// activemq-http declares this Jetty WebSocket server integration as optional,
	// but the embedded broker enables the ws:// connector at runtime.
	implementation 'org.eclipse.jetty.ee11.websocket:jetty-ee11-websocket-jetty-server:12.1.12'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.apache.activemq:activemq-spring'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'com.google.code.gson:gson'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	//gRPC
	implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"

	developmentOnly fileTree(dir:'lib',includes:['*jar'])
	testRuntimeOnly fileTree(dir:'lib',includes:['*jar'])

	// Jtest
	testImplementation 'org.apiguardian:apiguardian-api:1.1.2'
	testImplementation 'org.hamcrest:hamcrest:2.2'
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
	testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
	testImplementation 'org.junit.jupiter:junit-jupiter-migrationsupport:5.9.2'
	testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'
	testImplementation 'pl.pragmatists:JUnitParams:1.1.1'
	testImplementation 'org.junit.platform:junit-platform-commons:1.9.2'
	testImplementation 'org.junit.platform:junit-platform-engine:1.9.2'
	testImplementation 'org.junit.platform:junit-platform-launcher:1.9.2'
	testImplementation 'org.junit.platform:junit-platform-runner:1.9.2'
	testImplementation 'org.junit.platform:junit-platform-suite-api:1.9.2'
	testImplementation 'org.junit.vintage:junit-vintage-engine:5.9.2'
	testImplementation 'org.objenesis:objenesis:3.2'
	testImplementation 'org.opentest4j:opentest4j:1.2.0'
	testImplementation 'org.javassist:javassist:3.24.0-GA'

	testImplementation 'org.springframework.kafka:spring-kafka-test'

	testImplementation 'org.springframework.amqp:spring-rabbit-test:'

	testImplementation "io.grpc:grpc-testing:${grpcVersion}"
}

test {
	useJUnitPlatform()
}

ext {
	set('springCloudVersion', "2025.1.2")
}

dependencyManagement {
	// Spring Cloud's BOM exclusions must not become global Gradle exclusions.
	// Otherwise Spring Framework's spring-web is removed from the runtime classpath.
	applyMavenExclusions = false
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

configurations.configureEach {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'org.apache.activemq') {
			details.useVersion('6.3.2')
			because('ActiveMQ Classic modules must use one consistent Jetty 12-compatible version')
		}
	}
}

// Generate META-INF/build-info.properties for build information.
springBoot {
	buildInfo {
		// Workaround for failing to inject BuildProperties when started with
		// SpringBootApplication main method or STS Boot Dashboard.
		//
		// How-to:
		// When PDA failed to start in the IDE with the following description:
		// Field buildProperties in com.parasoft.demoapp.service.BuildInfoService required a bean of type
		// 'org.springframework.boot.info.BuildProperties' that could not be found.
		//
		// Steps required:
		// 1. Run bootBuildInfo Gradle task in the Gradle Tasks build group.
		// 2. Refresh the project.(Right click on the project, Refresh in STS.)
		// 3. Start PDA.
		destinationDir = file('src/main/resources/META-INF')
		properties {
			additional = [
					'id': buildMetadata
			]
		}
	}
}

tasks.named('processResources') {
	dependsOn tasks.named('bootBuildInfo')
	// bootBuildInfo writes to src/main/resources for IDE launches. Gradle 8.14
	// rejects the identical generated and source resource without this policy.
	duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

bootWar {
	manifest {
		attributes(
				'Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher',
				'Loader-Path': 'WEB-INF/lib-provided,WEB-INF/lib,WEB-INF/classes,file:lib/'
		)
	}
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:3.14.0"
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.84.2'
		}
	}
	generateProtoTasks {
		all().each { task ->
			task.plugins {
				grpc {}
			}
		}
	}
}
